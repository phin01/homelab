services:
  curso-n8n:
    image: n8nio/n8n:1.114.2
    container_name: curso-n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost/
    volumes:
      - /home/phin/n8n_files:/home/node/.n8n
    networks:
      - homelab_webnet

networks:
  homelab_webnet:
    external: true
    name: homelab-site_webnet
